[package]
name = "acp-tunnel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Securely expose stdio ACP agents over authenticated WebSockets"
license = "MIT"
keywords = ["acp", "json-rpc", "websocket", "tunnel"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "acp_tunnel"
path = "src/lib.rs"

[[bin]]
name = "acp-tunnel"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { version = "=1.0.1", default-features = false, features = ["unstable_protocol_v2"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
http = "1.3"
regex = "1.11"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.17", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
