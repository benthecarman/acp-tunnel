listen = "127.0.0.1:8787"
max_frame_bytes = 10485760
connection_timeout_seconds = 10
keepalive_interval_seconds = 15
keepalive_timeout_seconds = 45
shutdown_timeout_seconds = 5
reconnect_grace_seconds = 30
max_replay_frames = 256
max_replay_bytes = 20971520
channel_capacity = 32
diagnostic_channel_capacity = 64
diagnostic_line_bytes = 65536
rewrite_cwd = true
allowed_origins = []

[agents.codex]
command = "codex-acp"
args = []
workspaces = ["project-a", "project-b"]
pass_env = ["PATH", "HOME", "OPENAI_API_KEY"]
env = { NO_BROWSER = "1" }
client_env_allowlist = ["SESSION_ENDPOINT", "SESSION_ACCESS_TOKEN"]
mcp_policy = "allowlisted"

[agents.claude]
command = "claude-agent-acp"
args = []
workspaces = ["project-a"]
pass_env = ["PATH", "HOME", "ANTHROPIC_API_KEY"]
env = { NO_BROWSER = "1" }
mcp_policy = "allowlisted"

[agents.goose]
command = "goose"
args = ["acp"]
workspaces = ["project-a"]
pass_env = ["PATH", "HOME", "GOOSE_PROVIDER", "GOOSE_MODEL"]
mcp_policy = "allowlisted"

[workspaces.project-a]
path = "/srv/workspaces/project-a"

[workspaces.project-b]
path = "/srv/workspaces/project-b"

[mcp_servers.developer-tools]
command = "/usr/local/bin/developer-mcp"
args = []
pass_env = ["API_TOKEN"]
client_env_allowlist = ["PROJECT_URL", "PROJECT_TOKEN"]
